<!-- v1 — PÁGINA NÃO ENCONTRADA (26/09/2026, varredura do computador). Antes, endereço errado no site dava uma página
     BRANCA, sem nada (o servidor responde 404 vazio). Esta página é servida sozinha na PRÉVIA (GitHub Pages usa o
     404.html da raiz); no AR ela só aparece quando o servidor (Caddy) ganhar a linha
     `handle_errors { rewrite * /404.html  file_server }` — pendência da infra, anotada em 03_site\_LEIA_DESKTOP_2026-09-26.md.
     O <base> abaixo existe porque o 404 é servido em QUALQUER endereço (até /a/b/c): sem ele, o CSS e a logo quebrariam. -->
<script>
  (function () {
    var p = location.pathname, raiz = p.indexOf('/alea-site-previa/') === 0 ? '/alea-site-previa/' : '/';
    document.write('<base href="' + raiz + '">');
  })();
</script>
